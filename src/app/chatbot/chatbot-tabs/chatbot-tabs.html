<div class="container">
    <div class="row">
        <div class="col-md-6">
            <div class="header-custom">
                <h4>Simple Chatbot {{headerSubText}}</h4>
            </div>
        </div>
        <div class="col-md-3">

            <div class="header-custom-no-left-margin">
                <button (click)="navigateToLangGraph()"
                    [ngClass]="isLangGraphActive? 'btn btn-secondary' : 'btn btn-primary'">
                    LangGraph
                </button>
            </div>
        </div>
        <div class="col-md-3">
            <div class="header-custom-no-left-margin">
                <button (click)="navigateToLangChain()"
                    [ngClass]="isLangChainActive? 'btn btn-secondary' : 'btn btn-primary'">
                    LangChain
                </button>
            </div>
        </div>
 
    </div>
</div>
