<div class="container">
    <div class="row">
        <div class="col-md-6">
            <div class="header-custom">
                <h4>Structured Output {{headerSubText}}</h4>
            </div>
        </div>
        <div class="col-md-2">

            <div class="header-custom-no-left-margin">
                <button (click)="navigateToTypedDict()"
                    [ngClass]="isTypedDictActive? 'btn btn-secondary' : 'btn btn-primary'">
                    TypedDict
                </button>
            </div>
        </div>
        <div class="col-md-2">
            <div class="header-custom-no-left-margin">
                <button (click)="navigateToPydantic()"
                    [ngClass]="isPydanticActive? 'btn btn-secondary' : 'btn btn-primary'">
                    PyDantic
                </button>
            </div>
        </div>
        <div class="col-md-2">
            <div class="header-custom-no-left-margin">
                <button (click)="navigateToJsonSchema()"
                    [ngClass]="isJsonSchemaActive? 'btn btn-secondary' : 'btn btn-primary'">
                    Json Schema
                </button>
            </div>
        </div>
    </div>
</div>
