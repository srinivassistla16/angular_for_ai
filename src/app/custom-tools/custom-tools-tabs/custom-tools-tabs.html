<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h4>Custom Tools {{headerSubText}}</h4>
        </div>
    </div>
    <div class="row">
        <div class="col-md-4">
            <div class="header-custom-no-left-margin">
                <button (click)="navigateToToolDecorator()"
                    [ngClass]="isToolDecoratorActive? 'btn btn-secondary' : 'btn btn-primary'">
                    @tool decorator
                </button>
            </div>
        </div>
        <div class="col-md-4">
            <div class="header-custom-no-left-margin">
                <button (click)="navigateToStructredTool()"
                    [ngClass]="isStructuredToolActive? 'btn btn-secondary' : 'btn btn-primary'">
                    Structured Tool
                </button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="header-custom-no-left-margin">
                <button (click)="navigateToBaseTool()"
                    [ngClass]="isBaseToolActive? 'btn btn-secondary' : 'btn btn-primary'">
                    Base Tool
                </button>
            </div>
        </div>
    </div>
</div>
