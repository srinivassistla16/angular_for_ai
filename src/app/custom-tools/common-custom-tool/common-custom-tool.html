<div class="container-fluid pane-bg-color">

    <form [formGroup]="multiplyInputForm">
        <div class="row custom-row-pad">
            <div class="col-md-2 inline-elements">
                <div class="icon-container input-div">
                    <mat-icon class="custom-color-mat-icon" matTooltip="Number 1" matTooltipPosition="right"
                        aria-label="Information icon">info</mat-icon>
                </div>
                <label for="num1">Number 1:</label>
            </div>
            <div class="col-md-2">
                <input type="text" formControlName="num1" class="form-control border border-dark"
                    [class.is-invalid]="multiplyInputForm.controls['num1']?.invalid && multiplyInputForm.controls['num1']?.touched">
                <small
                    [class.d-none]="multiplyInputForm.controls['num1']?.valid || multiplyInputForm.controls['num1']?.untouched"
                    class="text-danger">Mandatory</small>
            </div>
            <div class="col-md-2 inline-elements">
                <div class="icon-container input-div">
                    <mat-icon class="custom-color-mat-icon" matTooltip="Number 2" matTooltipPosition="right"
                        aria-label="Information icon">info</mat-icon>
                </div>
                <label for="num2">Number 2:</label>
            </div>
            <div class="col-md-2">
                <input type="text" formControlName="num2" class="form-control border border-dark"
                    [class.is-invalid]="multiplyInputForm.controls['num2']?.invalid && multiplyInputForm.controls['num2']?.touched">
                <small
                    [class.d-none]="multiplyInputForm.controls['num2']?.valid || multiplyInputForm.controls['num2']?.untouched"
                    class="text-danger">Mandatory</small>
            </div>
            <div class="col-md-4">
                <button type="button" class="btn btn-primary" [disabled]="multiplyInputForm.invalid"
                    (click)="doMultiply()">
                    Generate Summary
                </button>
            </div>
        </div>
    </form>
    <form [formGroup]="multiplyResponseForm">
        <div class="row custom-row-pad">
            <div class="col-md-2 inline-elements">
                <div class="icon-container input-div">
                    <mat-icon class="custom-color-mat-icon" matTooltip="Answer" matTooltipPosition="right"
                        aria-label="Information icon">info</mat-icon>
                </div>
                <label for="answer">Answer:</label>
            </div>
            <div class="col-md-2">
                <input type="text" formControlName="answer" class="form-control border border-dark"
                    [class.is-invalid]="multiplyResponseForm.controls['answer']?.invalid && multiplyResponseForm.controls['answer']?.touched">
                <small
                    [class.d-none]="multiplyResponseForm.controls['answer']?.valid || multiplyResponseForm.controls['answer']?.untouched"
                    class="text-danger">Mandatory</small>
            </div>
        </div>
        <div class="row custom-row-pad">
            <div class="col-md-2 inline-elements">
                <div class="icon-container input-div">
                    <mat-icon class="custom-color-mat-icon" matTooltip="Tool Name" matTooltipPosition="right"
                        aria-label="Information icon">info</mat-icon>
                </div>
                <label for="toolname">Tool Name:</label>
            </div>
            <div class="col-md-4">
                <input type="text" formControlName="toolname" class="form-control border border-dark"
                    [class.is-invalid]="multiplyResponseForm.controls['toolname']?.invalid && multiplyResponseForm.controls['toolname']?.touched">
                <small
                    [class.d-none]="multiplyResponseForm.controls['toolname']?.valid || multiplyResponseForm.controls['toolname']?.untouched"
                    class="text-danger">Mandatory</small>
            </div>
        </div>
        <div class="row custom-row-pad">
            <div class="col-md-2 inline-elements">
                <div class="icon-container input-div">
                    <mat-icon class="custom-color-mat-icon" matTooltip="Tool Description" matTooltipPosition="right"
                        aria-label="Information icon">info</mat-icon>
                </div>
                <label for="tooldesc">Tool Decription:</label>
            </div>
            <div class="col-md-4">
                <input type="text" formControlName="tooldesc" class="form-control border border-dark"
                    [class.is-invalid]="multiplyResponseForm.controls['tooldesc']?.invalid && multiplyResponseForm.controls['tooldesc']?.touched">
                <small
                    [class.d-none]="multiplyResponseForm.controls['tooldesc']?.valid || multiplyResponseForm.controls['tooldesc']?.untouched"
                    class="text-danger">Mandatory</small>
            </div>
        </div>
        <div class="row custom-row-pad">
            <div class="col-md-2 inline-elements">
                <div class="icon-container input-div">
                    <mat-icon class="custom-color-mat-icon" matTooltip="Tool Args" matTooltipPosition="right"
                        aria-label="Information icon">info</mat-icon>
                </div>
                <label for="toolargs">Tool Args:</label>
            </div>
            <div class="col-md-4">
                <input type="text" formControlName="toolargs" class="form-control border border-dark"
                    [class.is-invalid]="multiplyResponseForm.controls['toolargs']?.invalid && multiplyResponseForm.controls['toolargs']?.touched">
                <small
                    [class.d-none]="multiplyResponseForm.controls['toolargs']?.valid || multiplyResponseForm.controls['toolargs']?.untouched"
                    class="text-danger">Mandatory</small>
            </div>
        </div>

    </form>
</div>
